name: alim-study-assistant
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Web app / UI
      - streamlit==1.59.0

      # Local RAG / vector database
      - chromadb==1.5.9
      - sentence-transformers==5.6.0

      # LLM clients
      - ollama==0.6.2
      - google-genai==2.10.0
      - openai

      # Utilities
      - python-dotenv==1.2.2
      - requests==2.34.2
      - pandas==3.0.3

      # PDF support, optional but useful later
      - pypdf==6.14.2

      # Testing
      - pytest==9.1.1
